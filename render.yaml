services:
  - type: web
    name: food-classifier-api
    env: python
    buildCommand: pip install -r backend/requirements.txt && pip install gunicorn
    startCommand: cd backend && gunicorn app:APP --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PORT
        value: 10000
    healthCheckPath: /health

