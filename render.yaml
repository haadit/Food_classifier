services:
  - type: web
    name: food-classifier-api
    env: python
    pythonVersion: "3.11.9"
    buildCommand: git lfs install && git lfs pull && pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:APP --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --preload
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /
    healthCheckGracePeriod: 300

